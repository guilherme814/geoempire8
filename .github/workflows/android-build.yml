name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4  # ← Atualizado para v4
    
    - name: Setup Python
      uses: actions/setup-python@v5  # ← Atualizado para v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0 \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-ugly \
          gstreamer1.0-plugins-bad \
          gstreamer1.0-libav \
          gstreamer1.0-tools \
          libgstreamer1.0-dev \
          libgirepository1.0-dev \
          pkg-config \
          cmake \
          autoconf \
          libtool \
          libffi-dev \
          libssl-dev \
          automake
    
    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv
    
    - name: Setup Android SDK
      run: |
        mkdir -p ~/.buildozer/android/platform
        cd ~/.buildozer/android/platform
        
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p android-sdk/cmdline-tools
        mv cmdline-tools android-sdk/cmdline-tools/latest
        
        yes | android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
        export ANDROIDNDK="$HOME/.buildozer/android/platform/android-ndk-r25b"
        
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = GeoEmpire
        package.name = geoempire
        package.domain = com.example
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,json,ttf,woff
        version = 0.1
        requirements = python3,pygame
        orientation = landscape
        fullscreen = 0
        android.permissions = INTERNET
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.sdk = 33
        android.accept_sdk_license = True

        [buildozer]
        log_level = 2
        warn_on_root = 0
        EOF
    
    - name: Build APK
      run: |
        export BUILDOZER_WARN_ON_ROOT=0
        export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
        export ANDROIDNDK="$HOME/.buildozer/android/platform/android-ndk-r25b"
        export PATH="$ANDROIDSDK/cmdline-tools/latest/bin:$PATH"
        
        buildozer android debug 2>&1 | head -200
      env:
        BUILDOZER_WARN_ON_ROOT: 0
    
    - name: Upload APK  # ← CORRIGIDO: v3 → v4
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: geoempire-apk
        path: bin/*.apk
        if-no-files-found: warn
