name: Build APK (Godot)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Android SDK packages
      # O runner ubuntu-latest já traz o Android SDK em $ANDROID_HOME.
      run: |
        SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
        echo "sdkmanager: $SDKM"
        yes | "$SDKM" --licenses > /dev/null || true
        "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

    - name: Setup Godot + export templates
      uses: chickensoft-games/setup-godot@v2
      with:
        version: ${{ env.GODOT_VERSION }}
        use-dotnet: false
        include-templates: true

    - name: Create debug keystore
      run: |
        keytool -keyalg RSA -genkeypair -alias androiddebugkey \
          -keypass android -keystore "$GITHUB_WORKSPACE/debug.keystore" \
          -storepass android -dname "CN=Android Debug,O=Android,C=US" \
          -validity 9999 -deststoretype pkcs12

    - name: Configure Godot editor settings
      run: |
        mkdir -p ~/.config/godot
        cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
        [gd_resource type="EditorSettings" format=3]

        [resource]
        export/android/android_sdk_path = "$ANDROID_HOME"
        export/android/java_sdk_path = "$JAVA_HOME"
        export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
        export/android/debug_keystore_user = "androiddebugkey"
        export/android/debug_keystore_pass = "android"
        EOF

    - name: Import project
      # A primeira importação costuma terminar com código != 0; o log mostra erros de script.
      run: godot --headless --path . --import || true

    - name: Smoke test (roda a cena principal por 60 frames)
      # Falha o build se algum script não compilar (tela azul vazia no celular).
      run: |
        timeout 120 godot --headless --path . --quit-after 60 2>&1 | tee smoke.log || true
        if grep -E "Parse Error|Failed to load script|Failed to create an autoload" smoke.log; then
          echo "::error::Erro de script no Godot (veja o log acima)"
          exit 1
        fi

    - name: Teste de aceitacao (ciclo central, determinismo, guerra/paz/vassalagem, salvar/carregar)
      run: |
        timeout 540 godot --headless --path . --script tools/acceptance_test.gd 2>&1 | tee acceptance.log || true
        if grep -E "^FAIL|SCRIPT ERROR|Parse Error" acceptance.log || ! grep -q "^RESULT:" acceptance.log; then
          echo "::error::Teste de aceitacao falhou (veja o log acima)"
          exit 1
        fi

    - name: Auditoria de economia (10 anos sem jogador; informativo)
      run: |
        timeout 540 godot --headless --path . --script tools/economy_audit.gd 2>&1 | tee economy.log || true
        grep -E "SCRIPT ERROR|Parse Error" economy.log && exit 1 || true

    - name: Export APK
      run: |
        mkdir -p build
        godot --headless --path . --export-debug "Android" build/geoempire-debug.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: geoempire-apk
        path: build/*.apk
        if-no-files-found: warn
