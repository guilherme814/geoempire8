<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1b3a4a"/>
      <stop offset="0.6" stop-color="#0c1c28"/>
      <stop offset="1" stop-color="#060d14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2a0"/>
      <stop offset="0.55" stop-color="#c9a45a"/>
      <stop offset="1" stop-color="#8a6a30"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8343f"/>
      <stop offset="1" stop-color="#6e1722"/>
    </linearGradient>
    <clipPath id="orb"><circle cx="256" cy="256" r="150"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- meridianos e paralelos -->
  <g clip-path="url(#orb)" fill="none" stroke="#c9a45a" stroke-opacity="0.35" stroke-width="2">
    <ellipse cx="256" cy="256" rx="150" ry="52"/>
    <ellipse cx="256" cy="256" rx="150" ry="104"/>
    <ellipse cx="256" cy="256" rx="52" ry="150"/>
    <ellipse cx="256" cy="256" rx="104" ry="150"/>
    <line x1="256" y1="106" x2="256" y2="406"/>
    <line x1="106" y1="256" x2="406" y2="256"/>
  </g>
  <!-- território em destaque: cunha rubra -->
  <path d="M256 256 L256 106 A150 150 0 0 1 386 181 Z" fill="url(#red)" opacity="0.92"/>
  <!-- anel -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#c9a45a" stroke-opacity="0.45" stroke-width="2"/>
  <!-- rosa dos ventos: quatro lâminas -->
  <g fill="url(#gold)">
    <path d="M256 52 L272 240 L256 256 L240 240 Z"/>
    <path d="M256 460 L240 272 L256 256 L272 272 Z" opacity="0.8"/>
    <path d="M52 256 L240 240 L256 256 L240 272 Z" opacity="0.8"/>
    <path d="M460 256 L272 272 L256 256 L272 240 Z"/>
  </g>
  <circle cx="256" cy="256" r="14" fill="#0c1c28" stroke="url(#gold)" stroke-width="5"/>
  <!-- ano -->
  <text x="256" y="486" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="10" fill="#c9a45a" fill-opacity="0.85">1836</text>
</svg>
